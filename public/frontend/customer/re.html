<!DOCTYPE html>
<html>
<head>
  <title>🔥 Produk Trending dari Twitter</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f9f9f9; }
    h1 { color: #333; }
    .recommendation {
      background: #fff8e1;
      padding: 15px;
      border-left: 5px solid #ff9800;
      margin-bottom: 30px;
      border-radius: 5px;
    }
    a { color: #007bff; text-decoration: none; }
    small { display: block; margin-top: 5px; color: #555; }
  </style>
</head>
<body>
  <h1>🔥 Produk Trending dari Twitter</h1>
  <div id="recommendation" class="recommendation">Memuat rekomendasi...</div>

  <script>
    async function loadTrending() {
      try {
        const res = await fetch('http://localhost:8000/api/trending-products');
        const data = await res.json();
        const r = data.recommendation;

        document.getElementById('recommendation').innerHTML = `
          <h2>🎯 Skor Tertinggi</h2>
          <strong>${r.product_name}</strong><br>
          Skor: <span style="color: red; font-weight: bold;">${r.score}</span><br>
          <a href="${r.tweet_url}" target="_blank">Lihat Tweet</a>
          <small>${r.tweet_text.slice(0, 140)}...</small>
        `;
      } catch (err) {
        document.getElementById('recommendation').innerText = 'Gagal memuat data.';
        console.error('❌ Error saat fetch:', err);
      }
    }

    loadTrending();
  </script>
</body>
</html>
