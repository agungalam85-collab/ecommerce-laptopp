<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Checkout - Toko Agung</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      border-right: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(8px);
    }
    .sidebar h3 { margin-top: 0; font-size: 1.1em; color: #fff; }
    .sidebar ul { list-style: none; padding: 0; margin: 0; }
    .sidebar li { margin-bottom: 12px; }
    .sidebar a {
      text-decoration: none;
      color: #fff;
      padding: 8px 12px;
      display: block;
      border-radius: 6px;
      transition: background 0.3s;
    }
    .sidebar a:hover { background: rgba(255,255,255,0.2); }

    /* Topbar */
    .topbar {
      background: rgba(0,0,0,0.3);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    .logo { font-weight: 600; font-size: 1.2rem; }
    .nav-links button {
      background: #fff;
      color: #0072ff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s, transform 0.2s;
    }
    .nav-links button:hover { background: #e0e0e0; transform: scale(1.05); }
    .avatar-topbar {
      width: 36px; height: 36px;
      object-fit: cover;
      border-radius: 50%;
      margin-right: 8px;
    }

    /* Konten Utama */
    .main-content { margin-left: 240px; padding: 20px; }
    main h2 { font-size: 1.6rem; margin-bottom: 20px; }

    /* Form Checkout */
    .form-box {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 600px;
    }
    .form-box label {
      font-weight: 600;
      margin-bottom: 4px;
    }
    .form-box input, .form-box textarea, .form-box select {
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }
    .form-box textarea { min-height: 80px; resize: vertical; }

    .checkout-product-list {
      background: rgba(255,255,255,0.15);
      padding: 10px;
      border-radius: 8px;
      list-style: none;
      margin: 0;
    }
    .checkout-product-list li {
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    #shipping-cost, #product-total, #grand-total {
      font-weight: 600;
      margin-top: 6px;
    }

    .form-box button {
      background: #0072ff;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s, transform 0.2s;
    }
    .form-box button:hover { background: #0056b3; transform: scale(1.05); }

    .result-box {
      margin-top: 20px;
      padding: 12px;
      background: rgba(255,255,255,0.15);
      border-radius: 8px;
      min-height: 40px;
    }

    /* Item produk di checkout */
.checkout-product-list {
  background: rgba(255,255,255,0.15);
  padding: 10px;
  border-radius: 8px;
  list-style: none;
  margin: 0;
}

.checkout-product-list li {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  font-size: 0.95rem;
}

/* Thumbnail produk */
.product-thumb {
  width: 60px;       /* kecilin gambar */
  height: 60px;
  object-fit: cover; /* biar proporsional */
  border-radius: 6px;
  flex-shrink: 0;
}

/* Info produk */
.product-info {
  line-height: 1.4;
}

    /* Responsif */
    @media (max-width: 768px) {
      .sidebar { position: static; width: 100%; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.2); }
      .main-content { margin-left: 0; }
      .topbar { flex-direction: column; align-items: flex-start; gap: 10px; }
      .form-box { max-width: 100%; }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <h3>📂 Menu</h3>
    <ul>
      <li><a href="index.html">🏷️ Produk</a></li>
      <li><a href="keranjang.html">🛒 Keranjang</a></li>
      <li><a href="riwayat.html">📜 Riwayat</a></li>
      <li><a href="profil.html">👤 Profil</a></li>
      <li><a href="detailpembayaran.html">💳 Detail Pembayaran</a></li>
      <li><a href="avatar.html">🖼️ Avatar</a></li>
    </ul>
  </aside>

  <!-- Konten Utama -->
  <div class="main-content">
    <header class="topbar">
      <div class="logo">🛍️ <strong>Toko Online</strong></div>
      <div class="welcome">
        <a href="avatar.html" title="Ganti Foto">
          <img id="avatarPreview" src="/images/default.jpg" alt="Avatar" class="avatar-topbar" />
        </a>
        Halo, <span id="customerName">Customer</span>
      </div>
      <nav class="nav-links">
        <button id="logoutBtn">Logout</button>
      </nav>
    </header>

    <main>
      <h2>📦 Checkout Pengiriman</h2>
      <form id="checkoutForm" class="form-box">
        <label for="address">Alamat Tujuan</label>
        <textarea id="address" required></textarea>

        <label>Produk yang Dibeli</label>
        <ul id="product_ids" class="checkout-product-list"></ul>

        <label for="province">Provinsi</label>
        <select id="province" required></select>

        <label for="city">Kota</label>
        <select id="city" required></select>

        <label for="district">Kecamatan</label>
        <select id="district" required></select>

        <label for="weight">Berat Barang (gram) untuk hitung masukan jumlah semua belanjaan anda misal 3 produk</label>
        <input type="number" id="weight" required min="1" />

        <label for="courier">Kurir</label>
        <select id="courier" required></select>

        <div id="shipping-cost">Ongkir: Rp0</div>

        <label for="payment">Metode Pembayaran</label>
        <select id="payment" required>
          <option value="midtrans">Midtrans</option>
          <option value="cod">Bayar di Tempat</option>
        </select>

        <div id="product-total">Total Produk: Rp0</div>
        <div id="grand-total">Total Bayar: Rp0</div>

        <button type="submit">Bayar Sekarang</button>
      </form>

      <div id="result" class="result-box"></div>
    </main>
  </div>

  <script src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="Mid-client-A_1dU7wQlkD792v2"></script>
  <script type="module" src="checkout.js"></script>
</body>
</html>
