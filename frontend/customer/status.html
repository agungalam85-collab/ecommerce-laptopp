<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Status Pembayaran</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      border-right: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(8px);
    }
    .sidebar h3 { margin-top: 0; font-size: 1.1em; color: #fff; }
    .sidebar ul { list-style: none; padding: 0; margin: 0; }
    .sidebar li { margin-bottom: 12px; }
    .sidebar a {
      text-decoration: none;
      color: #fff;
      padding: 8px 12px;
      display: block;
      border-radius: 6px;
      transition: background 0.3s;
    }
    .sidebar a:hover { background: rgba(255,255,255,0.2); }

    /* Topbar */
    .topbar {
      background: rgba(0,0,0,0.3);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    .logo { font-weight: 600; font-size: 1.2rem; }
    .nav-links button {
      background: #fff;
      color: #0072ff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s, transform 0.2s;
    }
    .nav-links button:hover { background: #e0e0e0; transform: scale(1.05); }
    .avatar-topbar {
      width: 36px; height: 36px;
      object-fit: cover;
      border-radius: 50%;
      margin-right: 8px;
    }

    /* Konten Utama */
    .main-content { margin-left: 240px; padding: 20px; }
    main h2 { font-size: 1.6rem; margin-bottom: 20px; }

    /* Box Status */
    .status-box {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      min-height: 100px;
      font-size: 1rem;
      line-height: 1.5;
    }
    .status-success { color: #2ecc71; font-weight: 600; }
    .status-pending { color: #f1c40f; font-weight: 600; }
    .status-failed { color: #e74c3c; font-weight: 600; }

    /* Responsif */
    @media (max-width: 768px) {
      .sidebar { position: static; width: 100%; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.2); }
      .main-content { margin-left: 0; }
      .topbar { flex-direction: column; align-items: flex-start; gap: 10px; }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <h3>📂 Menu</h3>
    <ul>
      <li><a href="index.html">🏷️ Produk</a></li>
      <li><a href="keranjang.html">🛒 Keranjang</a></li>
      <li><a href="riwayat.html">📜 Riwayat</a></li>
      <li><a href="profil.html">👤 Profil</a></li>
      <li><a href="avatar.html">🖼️ Avatar</a></li>
      <li><a href="wishlist.html">❤️ Wishlist</a></li>
      <li><a href="detailpembayaran.html">💳 Detail Pembayaran</a></li>
      <li><a href="status.html">📊 Status</a></li>
    </ul>
  </aside>

  <!-- Konten Utama -->
  <div class="main-content">
    <header class="topbar">
      <div class="logo">🛍️ <strong>Toko Online</strong></div>
      <div class="welcome">
        <a href="avatar.html" title="Ganti Foto">
          <img id="avatarPreview" src="/images/default.jpg" alt="Avatar" class="avatar-topbar" />
        </a>
        Halo, <span id="customerName">Customer</span>
      </div>
      <nav class="nav-links">
        <button id="logoutBtn">Logout</button>
      </nav>
    </header>

    <main>
      <h2>📊 Status Pembayaran</h2>
      <div class="status-box">Memuat status pembayaran...</div>
    </main>
  </div>

  <script src="status.js"></script>
</body>
</html>
