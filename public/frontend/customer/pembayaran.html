<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Detail Pembayaran</title>
  <link rel="stylesheet" href="index.css" />
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .container h2 {
      text-align: center;
      margin-bottom: 24px;
    }
    .container p {
      margin: 8px 0;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-success { background: #4caf50; color: white; }
    .badge-warning { background: #ff9800; color: white; }
    .badge-danger  { background: #f44336; color: white; }
    .btn-copy {
      margin-left: 8px;
      padding: 6px 12px;
      background: #2196f3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-copy:active {
      background: #1976d2;
    }
    .btn-wa {
      margin-top: 16px;
      display: inline-block;
      background: #25d366;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Detail Pembayaran</h2>
    <div id="payment-box">Memuat data pembayaran...</div>
  </div>

  <script type="module">
    const order_id = new URLSearchParams(location.search).get('order_id');
    const token = localStorage.token;

    async function loadPaymentDetail() {
      const box = document.getElementById('payment-box');

      if (!order_id || !token) {
        box.innerHTML = '<p class="badge badge-danger">❌ Order ID atau token tidak tersedia</p>';
        return;
      }

      try {
        const res = await fetch(`/api/payment-detail/${order_id}`, {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (!res.ok) {
          const err = await res.json();
          box.innerHTML = `<p class="badge badge-danger">❌ Gagal ambil data: ${res.status} - ${err.message}</p>`;
          return;
        }

        const data = await res.json();
        const badgeClass = {
          pending: 'badge-warning',
          settlement: 'badge-success',
          capture: 'badge-success',
          expire: 'badge-danger',
          cancel: 'badge-danger',
          deny: 'badge-danger'
        }[data.transaction_status] || 'badge-warning';

        box.innerHTML = `
          <p><strong>Order ID:</strong> ${data.order_id}</p>
          <p><strong>Status:</strong> <span class="badge ${badgeClass}">${data.transaction_status}</span></p>
          <p><strong>Bank:</strong> ${data.bank ?? '-'}</p>
          <p><strong>VA Number:</strong> <span id="va">${data.va_number ?? '-'}</span>
            ${data.va_number ? '<button class="btn-copy" onclick="copyVA()">Salin</button>' : ''}
          </p>
          <p><strong>Total:</strong> Rp ${Number(data.gross_amount).toLocaleString()}</p>
          <p><strong>Batas Bayar:</strong> ${data.expiry_time ?? '-'}</p>
          ${data.va_number ? `<a class="btn-wa" target="_blank" href="https://wa.me/62XXXXXXXXXX?text=${encodeURIComponent(`Halo, saya ingin konfirmasi pembayaran untuk order ${data.order_id} ke VA ${data.va_number} (${data.bank}) sebesar Rp ${Number(data.gross_amount).toLocaleString()}`)}">Kirim via WhatsApp</a>` : ''}
        `;
      } catch (err) {
        box.innerHTML = `<p class="badge badge-danger">❌ Gagal ambil detail pembayaran</p>`;
        console.error(err);
      }
    }

    function copyVA() {
      const va = document.getElementById('va').textContent;
      navigator.clipboard.writeText(va);
      alert('VA berhasil disalin!');
    }

    loadPaymentDetail();
  </script>
</body>
</html>
