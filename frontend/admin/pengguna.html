<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Pengguna</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: #fff;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 8px;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background-color: #f0f0f0;
      color: #444;
    }

    tr:nth-child(even) {
      background-color: #fafafa;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    td[colspan="5"] {
      text-align: center;
      font-style: italic;
      color: #888;
    }
  </style>
</head>
<body onload="loadUsers()">
  <div class="container">
    <h2>👥 Daftar Pengguna</h2>
    <table>
      <thead>
        <tr>
          <th>Nama</th>
          <th>Email</th>
          <th>Role</th>
          <th>Password</th>
          <th>Terdaftar</th>
		   <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="userTable">
        <tr><td colspan="6">Memuat data pengguna...</td></tr>
      </tbody>
    </table>
  </div>

  <script src="pengguna.js"></script>
</body>
</html>
